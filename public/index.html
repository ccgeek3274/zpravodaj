<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zpravodaj soutěže</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- v8.5.0 má interní TDZ bug v UMD bundlu; 7.8.2 je stabilní. Na cdnjs docx není. -->
<script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"
        integrity="sha384-zjTqOObJTD6OT6CUn8mSpDY+crIiP0cX457OjcZosSATiUFbmdXa9KRScjfLVxFH"
        crossorigin="anonymous"></script>
<script src="https://app.sachytynec.cz/back.js" defer></script>
<style>
:root {
  /* Paper & Ink — stejný jazyk jako sscr-soupiska a kontrolasoupisky */
  --ink:        oklch(0.22 0.008 60);
  --paper:      oklch(0.955 0.012 88);
  --header:     oklch(0.925 0.013 86);
  --screen:     oklch(0.20 0.006 60);
  --field-bg:   oklch(0.99 0.004 88);
  --field-bd:   oklch(0.55 0.012 60);
  --divider:    oklch(0.85 0.012 78);
  --muted:      oklch(0.45 0.012 60);
  --muted-2:    oklch(0.50 0.012 60);
  --muted-dark: oklch(0.70 0.012 75);
  --highlight:  oklch(0.91 0.012 84);
  --cream:      oklch(0.95 0.012 88);
  --radius: 3px;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --sans: 'Hanken Grotesk', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --ok:#1f7a3d; --err:#b3261e; --warn:#9a5b15;
}
* { box-sizing:border-box; }
html, body { margin:0; padding:0; }
body {
  font-family:var(--sans); background:var(--screen); color:var(--ink);
  padding:52px 24px 80px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.wrap { max-width:820px; margin:0 auto; }

.app-head { margin-bottom:28px; }
.checker { height:7px; width:116px; border-radius:2px; margin-bottom:18px;
  background:repeating-conic-gradient(oklch(0.95 0.012 88) 0 90deg, oklch(0.34 0.01 60) 0 180deg) 0 0 / 14px 14px; }
.app-title { font-family:var(--mono); font-size:28px; font-weight:700; letter-spacing:0.04em;
  text-transform:uppercase; color:var(--cream); line-height:1.1; margin:0; }
.app-sub { font-size:14.5px; color:var(--muted-dark); margin:10px 0 0; }

.card { background:var(--paper); border:1px solid var(--ink); border-radius:var(--radius); }
.card-strip { display:flex; align-items:center; gap:12px; padding:15px 20px;
  border-bottom:1px solid var(--ink); background:var(--header); border-radius:2px 2px 0 0; }
.card-strip h2 { margin:0; font-family:var(--mono); font-size:14px; font-weight:700; letter-spacing:0.03em;
  text-transform:uppercase; color:var(--ink); }
.strip-right { margin-left:auto; font-family:var(--mono); font-size:12.5px; color:var(--muted); }
.card-body { padding:20px; }

.eyebrow { font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:0.06em;
  text-transform:uppercase; color:var(--muted); margin-bottom:7px; display:block; }
input, textarea {
  width:100%; padding:11px 14px; font-family:var(--sans); font-size:14.5px; color:var(--ink);
  background:var(--field-bg); border:1px solid var(--field-bd); border-radius:var(--radius);
  transition:border-color .15s; }
input { height:44px; padding:0 14px; }
input[type=number], #fname { font-family:var(--mono); }
textarea { min-height:78px; resize:vertical; line-height:1.6; }
input::placeholder, textarea::placeholder { color:var(--field-bd); }
input:focus, textarea:focus { outline:none; border-color:var(--ink); }
.hint { display:block; margin-top:7px; font-size:12px; color:var(--muted-2); line-height:1.5;
  font-family:var(--sans); font-weight:400; letter-spacing:0; text-transform:none; }
.hint code { font-family:var(--mono); font-size:11.5px; background:var(--highlight);
  color:oklch(0.28 0.008 60); padding:1px 6px; border-radius:2px; }

.field { margin-top:18px; }
.field:first-child { margin-top:0; }
.row { display:grid; grid-template-columns:1fr 160px; gap:14px; align-items:start; }

.fname-preview { font-family:var(--mono); font-weight:600; color:var(--ink);
  text-transform:none; letter-spacing:0; }

/* ── Tlačítka ─────────────────────────────────────────────────── */
button { font-family:var(--mono); cursor:pointer; border-radius:var(--radius);
  border:1px solid transparent; transition:filter .15s, background .15s, opacity .15s; }
button:disabled { opacity:.45; cursor:not-allowed; }
button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
.actions { display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; align-items:center; }
.btn-primary { background:var(--ink); color:var(--cream); border-color:var(--ink);
  font-size:14px; font-weight:600; height:44px; padding:0 22px; letter-spacing:0.02em; }
.btn-primary:hover:not(:disabled) { filter:brightness(1.35); }
.btn-outline { background:var(--paper); color:var(--ink); border:1px solid var(--ink);
  font-size:13px; font-weight:600; height:44px; padding:0 16px; }
.btn-outline:hover:not(:disabled) { background:var(--header); }

#msg { margin-top:14px; font-size:13px; min-height:18px; font-family:var(--mono); color:var(--muted); }
.ok  { color:var(--ok); }
.err { color:var(--err); }
.note { margin-top:12px; padding:12px 14px; font-family:var(--sans); font-size:12.5px; color:var(--muted);
  line-height:1.5; background:var(--field-bg); border:1px solid var(--divider); border-radius:var(--radius); }

/* ── Název soutěže pod polem ID ──────────────────────────────── */
#compNameView { margin-top:7px; font-size:12.5px; color:var(--muted-2); min-height:17px; }
#compNameView b { color:var(--ink); font-weight:600; }
#compNameView .region { display:block; }

/* ── Historie posledních generování (nahoře, dvouřádkové chipy) ─ */
#history:empty { display:none; }
#history:empty + .field { margin-top:0; }
#history { margin-bottom:18px; padding-bottom:18px; border-bottom:1px solid var(--divider); }
#hist-list { display:flex; flex-wrap:wrap; gap:8px; }
.hist-item { display:flex; flex-direction:column; gap:2px; padding:8px 12px; text-align:left;
  background:var(--field-bg); border:1px solid var(--field-bd); }
.hist-item:hover { background:var(--highlight); border-color:var(--ink); }
.hist-name { font-family:var(--sans); font-size:13px; font-weight:600; color:var(--ink); }
.hist-tpl  { font-family:var(--mono); font-size:11.5px; color:var(--muted); }

/* ── Lišta se stažením + náhled dokumentu ────────────────────── */
#output { margin-top:16px; }
#output:empty { display:none; }
#dl-bar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
/* lišta leží na tmavém pozadí (mimo kartu) → invertované barvy */
#btn-dl  { background:var(--cream); color:var(--ink); border-color:var(--cream);
  font-size:14px; font-weight:600; height:44px; padding:0 22px; }
#btn-dl:hover { background:var(--paper); filter:brightness(0.94); }
#btn-pdf { background:transparent; color:var(--cream); border:1px solid var(--muted-dark);
  font-size:13px; font-weight:600; height:44px; padding:0 16px; }
#btn-pdf:hover { border-color:var(--cream); }

/* Náhled je „papír" — barvy odpovídají vygenerovanému DOCX, ne UI. */
.doc {
  background:#fff; color:#000; font-family:Arial, sans-serif;
  border:1px solid var(--ink); border-radius:var(--radius);
  padding:36px 40px; overflow-x:auto;
}
.doc-hdr { text-align:right; font-size:11px; line-height:1.25; margin-bottom:8px; }
.doc h1 { text-align:center; font-size:20px; margin:6px 0 16px; }
.doc h2 { font-size:13px; font-weight:bold; margin:16px 0 6px; }
/* šířka podle obsahu (ne 100 %) → buňky se neroztahují */
.doc table { border-collapse:collapse; width:auto; max-width:100%; margin-bottom:6px; font-size:13px; }
.doc td, .doc th { border:1px solid #aaa; padding:2px 7px; vertical-align:middle; }
.doc .c { text-align:center; } .doc .r { text-align:right; } .doc .l { text-align:left; }
.doc tr.mh td { background:#C8D9F0; font-weight:bold; }
.doc table.stand th { background:#C8D9F0; font-weight:bold; }
.doc table.stand tbody tr:nth-child(even) td { background:#F2F2F2; }
.doc table.res td.elo, .doc table.res td.num { white-space:nowrap; }
.doc p { margin:4px 0; font-size:13px; }

@media (max-width:640px) {
  body { padding:32px 16px 60px; }
  .row { grid-template-columns:1fr; }
  .doc { padding:20px 16px; }
}

/* tisk → uložit jako PDF: schovej formulář, ukaž jen dokument */
@media print {
  body { background:#fff; padding:0; }
  body * { visibility:hidden; }
  #output, #output * { visibility:visible; }
  #output { position:absolute; left:0; top:0; width:100%; margin:0; }
  #dl-bar { display:none !important; }
  .doc { border:none; padding:0; overflow:visible; }
}
</style>
</head>
<body>
<div class="wrap">

  <div class="app-head">
    <div class="checker"></div>
    <h1 class="app-title">Zpravodaj soutěže</h1>
    <p class="app-sub">Generátor zpravodaje kola soutěže družstev ŠSČR do DOCX — data z api.chess.cz.</p>
  </div>

  <div class="card">
    <div class="card-strip">
      <h2>Zadání</h2>
      <span class="strip-right">~1 dotaz / s</span>
    </div>
    <div class="card-body">
      <div id="history"></div>

      <div class="field row">
        <div>
          <label class="eyebrow" for="compId">ID soutěže</label>
          <input type="number" id="compId" value="3317">
          <div id="compNameView"></div>
        </div>
        <div>
          <label class="eyebrow" for="kolo">Číslo kola</label>
          <input type="number" id="kolo" value="1">
        </div>
      </div>

      <div class="field">
        <label class="eyebrow" for="poznamka">Doplňující text — sekce „Různé"</label>
        <textarea id="poznamka">Prosím o kontrolu hráčů i výsledků, zda jsem někde neudělal chybu.</textarea>
      </div>

      <div class="field">
        <label class="eyebrow" for="fname">Název souboru: <span id="fnamePreview" class="fname-preview"></span></label>
        <input type="text" id="fname" value="[soutez]_[kolo]" spellcheck="false">
        <span class="hint">Placeholdery: <code>[soutez]</code> = ID soutěže, <code>[kolo]</code> = číslo kola</span>
      </div>

      <div class="actions">
        <button id="btn-gen" class="btn-primary" onclick="generate()">Generovat</button>
        <button id="btn-clear" class="btn-outline" onclick="clearCache()"
                title="V případě že došlo ke opravě výsledků na stránkách ŠSČR">Vymazat cache</button>
      </div>

      <div id="msg"></div>
    </div>
  </div>

  <div id="output"></div>

</div>

<script>
/* ================================================================
   DŮLEŽITÉ: žádný přístup k docx.* na top-levelu skriptu!
   UMD bundle má interní TDZ chyby při inicializaci.
   Veškerý přístup k docx.* probíhá uvnitř funkčních těl (lazy).
   ================================================================ */

/* ── Rozměry stránky (jen čísla, žádná závislost na docx) ──────── */
const API     = 'https://api.chess.cz/api';
const PAGE_W  = 11906;
const PAGE_H  = 16838;
const MARGIN  = 1440;
const CONTENT = PAGE_W - 2 * MARGIN; // 9026 DXA
const CM      = 567;                 // 1 cm ≈ 567 twips (dxa)

// Výsledková tabulka — 6 sloupců (jméno a ELO odděleně):
// č.partie | domácí jméno | dom. ELO | výsledek | hosté ELO | hosté jméno
const COL_BOARD  = 460;
const COL_RESULT = 1120;
const COL_ELO    = 640;
// COL_NAME se počítá dynamicky podle nejdelšího jména (viz computeNameWidth)

const FS = 20;             // 10 pt (half-points)
// Min. rozestup mezi voláními API (ms). chess.cz agresivně blokuje IP při
// nárazovém přístupu — držíme ~1 req/s (stejně jako sscr-soupiska).
const API_INTERVAL = 1100;
const BLOCK_MS     = 10 * 60 * 1000;   // self-block po 429/síťové chybě (10 min)

// Barvy (jen řetězce)
const C_HDR    = 'C8D9F0';
const C_ALT    = 'F2F2F2';
const C_WHITE  = 'FFFFFF';
const C_BORDER = 'AAAAAA';

// Ohraničení
const B_S   = { style: 'single', size: 4, color: C_BORDER };
const B_ALL = { top: B_S, bottom: B_S, left: B_S, right: B_S };

/* ── Cache (localStorage) ──────────────────────────────────────────
   TTL podle endpointu: „skoro živá" data kola — výsledky (matches) i pořadí
   (table) — držíme jen 10 min. Tabulka se přepočítává současně s výsledky,
   takže po aktualizaci matches nesmí pořadí viset hodinu na starých datech.
   (Stejný princip krátkého TTL jako proxy v pgn-base; ne skip-empty logikou.)
   Ostatní endpointy (details, schedule) 1 h. */
const TTL_DEFAULT = 3_600_000;   // 1 h
const TTL_LIVE    =   600_000;   // 10 min (matches + table)
function ttlFor(path) {
  return /\/(matches|table)$/.test(path) ? TTL_LIVE : TTL_DEFAULT;
}
function cacheKey(path) {
  return 'sscr_' + btoa(unescape(encodeURIComponent(path)));
}
function getCached(path) {
  try {
    const raw = localStorage.getItem(cacheKey(path));
    if (!raw) return null;
    const { data, ts } = JSON.parse(raw);
    if (Date.now() - ts > ttlFor(path)) { localStorage.removeItem(cacheKey(path)); return null; }
    return data;
  } catch (e) { return null; }
}
function setCache(path, data) {
  try { localStorage.setItem(cacheKey(path), JSON.stringify({ data, ts: Date.now() })); } catch (e) {}
}
function clearCache() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    if (localStorage.key(i).startsWith('sscr_')) keys.push(localStorage.key(i));
  }
  keys.forEach(k => localStorage.removeItem(k));
  setMsg('Cache vymazána (' + keys.length + ' položek).', 'ok');
}

/* ── Rate-limitované API ─────────────────────────────────────────
   Cache hit → okamžitě. Jinak se dotaz zařadí do serializované fronty
   s rozestupem ≥ API_INTERVAL (ani souběžná volání — např. náhled názvu
   soutěže během generování — rozestup neobejdou). Po 429/síťové chybě
   se aplikace sama na BLOCK_MS přestane API ptát. */
let _chain = Promise.resolve();
let _apiTs = 0;
let _blockUntil = 0;
function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

function apiGet(path, label, quiet, force) {
  label = label || path;
  if (!force) {
    const hit = getCached(path);
    if (hit !== null) { console.log('[cache hit]', path); return Promise.resolve(hit); }
  }
  const run = async function() {
    // mezitím mohl stejný dotaz ve frontě naplnit cache
    if (!force) { const hit = getCached(path); if (hit !== null) return hit; }
    if (Date.now() < _blockUntil) {
      const min = Math.ceil((_blockUntil - Date.now()) / 60000);
      throw new Error('API je dočasně blokováno (rate-limit) — zkuste to za ' + min + ' min.');
    }
    const wait = Math.max(0, _apiTs + API_INTERVAL - Date.now());
    if (wait > 0) await sleep(wait);
    if (!quiet) setMsg('Načítám: ' + label + '…');
    _apiTs = Date.now();
    let r;
    try {
      r = await fetch(API + path);
    } catch (e) {
      _blockUntil = Date.now() + BLOCK_MS;
      throw new Error('Síťová chyba / timeout — API zablokováno na 10 min (' + label + ').');
    }
    if (r.status === 429) {
      _blockUntil = Date.now() + BLOCK_MS;
      throw new Error('Rate-limit (429) — pauza 10 min.');
    }
    if (!r.ok) throw new Error('HTTP ' + r.status + ' — ' + label);
    const data = await r.json();
    // TODO(nová sezóna): až bude jasné, jak vypadá odpověď „kolo ještě nemá
    // výsledky", přidat sem pro /matches podmínku `if (!isEmpty(data)) setCache(...)`,
    // ať se prázdné kolo neuloží ani na 10 min. Do té doby to kryje krátký TTL.
    setCache(path, data);
    return data;
  };
  const p = _chain.then(run, run);
  _chain = p.then(function() {}, function() {});
  return p;
}

/* ── Pomocné funkce ─────────────────────────────────────────────── */
function setMsg(html, cls) {
  document.getElementById('msg').innerHTML =
    cls ? '<span class="' + cls + '">' + html + '</span>'
        : '<span>' + html + '</span>';
}
function norm(d) { return Array.isArray(d) ? d : (d ? [d] : []); }

function fmtHalf(v) {
  if (v == null) return '0';
  const n = parseFloat(v);
  if (isNaN(n)) return String(v);
  const w = Math.floor(n), h = (n - w) >= 0.5;
  if (w === 0 && h) return '½';
  return h ? w + '½' : String(w);
}
function fmtScore(h, a) {
  return (h == null || a == null) ? '' : fmtHalf(h) + ' – ' + fmtHalf(a);
}
function fmtResult(h, a) {
  if (h === 1   && a === 0)   return '1 : 0';
  if (h === 0   && a === 1)   return '0 : 1';
  if (h === 0.5 && a === 0.5) return '½ : ½';
  return '';
}
function eloStr(v) { return (v != null && v !== '') ? String(v) : '0'; }
function fmtDateCz(s) {
  if (!s) return '';
  const [d, m, y] = s.split('.');
  return d + '. ' + m + '. ' + y;
}
function todayCz() {
  const d = new Date();
  return d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear();
}

// "Jukl Karel" → "Karel Jukl" (prohození jména a příjmení, jen u dvouslovných)
function vedouciName(s) {
  if (!s) return '';
  const p = s.trim().split(/\s+/);
  return p.length === 2 ? p[1] + ' ' + p[0] : s.trim();
}

// Šířka textu v px (Arial 10 pt). V prohlížeči přesně přes canvas, v Node hrubý odhad.
function textWidthPx(text, bold) {
  text = text || '';
  if (typeof document !== 'undefined' && document.createElement) {
    const c = textWidthPx._c || (textWidthPx._c = document.createElement('canvas'));
    const ctx = c.getContext('2d');
    ctx.font = (bold ? 'bold ' : '') + '10pt Arial';
    return ctx.measureText(text).width;
  }
  return text.length * (bold ? 7.4 : 7.0); // fallback (testy v Node) – konzervativní
}

// Šířka sloupce se jmény v DXA. Zohledňuje:
//  – jména hráčů (běžným řezem) → potřebují nameW
//  – názvy týmů (TUČNĚ, širší!)  → jsou v buňce přes span (jméno + ELO),
//    takže potřebují nameW + COL_ELO
// Vrací max obou požadavků, ať se nikdy nic nezalomí.
function computeNameWidth(matchList) {
  let maxPlayerPx = 0, maxTeamPx = 0;
  matchList.forEach(function(m) {
    maxTeamPx = Math.max(maxTeamPx,
      textWidthPx(m.homeTeamName || '', true),
      textWidthPx(m.awayTeamName || '', true));
    norm(m.matchGames).forEach(function(g) {
      maxPlayerPx = Math.max(maxPlayerPx,
        textWidthPx(g.homePlayerName || '', false),
        textWidthPx(g.awayPlayerName || '', false));
    });
  });
  const MARG = 180, REZ = 140;           // okraje buňky (90+90) + rezerva proti zalomení
  const needPlayer = Math.ceil(maxPlayerPx * 15) + MARG + REZ;
  const needTeam   = Math.ceil(maxTeamPx   * 15) + MARG + REZ - COL_ELO; // tým má navíc ELO sloupec
  const w = Math.max(needPlayer, needTeam);
  const maxAllowed = Math.floor((CONTENT - COL_BOARD - 2 * COL_ELO - COL_RESULT) / 2);
  return Math.max(1200, Math.min(w, maxAllowed));
}

/* ── Buňka ──────────────────────────────────────────────────────── */
function cell(text, opts) {
  opts = opts || {};
  const w     = opts.w     || 1000;
  const bold  = opts.bold  || false;
  const align = opts.align || 'left';
  const bg    = opts.bg    || C_WHITE;
  const fs    = opts.fs    || FS;
  const span  = opts.span  || 1;
  const vm    = opts.vm != null ? opts.vm : 24;
  const keepN = opts.keepNext || false;
  return new docx.TableCell({
    width:         { size: w, type: 'dxa' },
    columnSpan:    span,
    verticalAlign: 'center',
    shading:       { fill: bg, type: 'clear' },
    borders:       B_ALL,
    margins:       { top: vm, bottom: vm, left: 90, right: 90 },
    children: [new docx.Paragraph({
      alignment: align,
      keepNext:  keepN,   // drží řádek s následujícím → tabulka se nerozdělí mezi stránky
      keepLines: true,
      spacing:   { before: 0, after: 0, line: 240, lineRule: 'auto' },
      children: [new docx.TextRun({ text: String(text != null ? text : ''), bold: bold, size: fs, font: 'Arial' })]
    })]
  });
}

/* ── Tabulka jednoho zápasu (6 sloupců) ─────────────────────────── */
function buildMatchTable(match, matchNr, nameW) {
  const games   = norm(match.matchGames);
  const score   = fmtScore(match.homeTeamScore, match.awayTeamScore);
  const tableW  = COL_BOARD + nameW + COL_ELO + COL_RESULT + COL_ELO + nameW;
  const rows    = [];

  // Záhlaví zápasu (modré): číslo | DOMÁCÍ (span2, vlevo) | skóre | HOSTÉ (span2, vpravo)
  rows.push(new docx.TableRow({ cantSplit: true, children: [
    cell(matchNr,                  { w: COL_BOARD,        bold: true, bg: C_HDR, align: 'center', vm: 14, keepNext: true }),
    cell(match.homeTeamName || '', { w: nameW + COL_ELO,  bold: true, bg: C_HDR, align: 'left',  span: 2, vm: 14, keepNext: true }),
    cell(score,                    { w: COL_RESULT,       bold: true, bg: C_HDR, align: 'center', vm: 14, keepNext: true }),
    cell(match.awayTeamName || '', { w: COL_ELO + nameW,  bold: true, bg: C_HDR, align: 'right', span: 2, vm: 14, keepNext: true }),
  ]}));

  // Partie: č. | dom.jméno(vlevo) | dom.ELO(vpravo) | výsledek | hosté ELO(vlevo) | hosté jméno(vlevo)
  games.forEach(function(game, idx) {
    const kn = idx < games.length - 1;   // poslední řádek bez keepNext (neslepovat s textem za tabulkou)
    rows.push(new docx.TableRow({ cantSplit: true, children: [
      cell(idx + 1,                       { w: COL_BOARD,  align: 'center', keepNext: kn }),
      cell(game.homePlayerName || '',     { w: nameW,      align: 'left',   keepNext: kn }),
      cell(eloStr(game.homePlayerRating), { w: COL_ELO,    align: 'right',  keepNext: kn }),
      cell(fmtResult(game.homePlayerResult, game.awayPlayerResult), { w: COL_RESULT, align: 'center', keepNext: kn }),
      cell(eloStr(game.awayPlayerRating), { w: COL_ELO,    align: 'left',   keepNext: kn }),
      cell(game.awayPlayerName || '',     { w: nameW,      align: 'left',   keepNext: kn }),
    ]}));
  });

  return new docx.Table({
    width: { size: tableW, type: 'dxa' },
    columnWidths: [COL_BOARD, nameW, COL_ELO, COL_RESULT, COL_ELO, nameW],
    rows: rows,
  });
}

/* ── Tabulka pořadí ─────────────────────────────────────────────── */
function buildStandingsTable(teamList) {
  // P | Družstvo | Z | + | = | − | B | Sk | V
  var ws = [480, 0, 520, 520, 520, 520, 620, 700, 620];
  ws[1] = CONTENT - ws.reduce(function(a, b) { return a + b; }, 0);

  var hdrs   = ['P', 'Družstvo', 'Z', '+', '=', '−', 'B', 'Sk', 'V'];
  var aligns = ['center','left','center','center','center','center','center','center','center'];

  var rows = [];

  rows.push(new docx.TableRow({ cantSplit: true,
    children: hdrs.map(function(h, i) {
      return cell(h, { w: ws[i], bold: true, bg: C_HDR, align: aligns[i], keepNext: true });
    })
  }));

  teamList.forEach(function(team, idx) {
    var bg   = idx % 2 === 1 ? C_ALT : C_WHITE;
    var kn   = idx < teamList.length - 1;   // poslední řádek bez keepNext
    var vals = [
      team.teamRank    != null ? team.teamRank    : (idx + 1),
      team.teamName    || '',
      team.matchesPlayed != null ? team.matchesPlayed : 0,
      team.matchWins   != null ? team.matchWins   : 0,
      team.matchDraws  != null ? team.matchDraws  : 0,
      team.matchLosses != null ? team.matchLosses : 0,
      team.points      != null ? team.points      : 0,
      fmtHalf(team.score),
      team.wonGames    != null ? team.wonGames    : 0,
    ];
    rows.push(new docx.TableRow({ cantSplit: true,
      children: vals.map(function(v, i) {
        return cell(v, { w: ws[i], bg: bg, align: aligns[i], keepNext: kn });
      })
    }));
  });

  return new docx.Table({
    width: { size: CONTENT, type: 'dxa' },
    columnWidths: ws,
    rows: rows,
  });
}

/* ── Odstavec / mezera ──────────────────────────────────────────── */
function para(text, opts) {
  opts = opts || {};
  return new docx.Paragraph({
    alignment: opts.align || 'left',
    spacing:   { before: opts.before || 0, after: opts.after || 100 },
    children:  [new docx.TextRun({
      text: text, font: 'Arial', size: opts.size || 22, bold: opts.bold || false
    })]
  });
}
function gap() {
  return new docx.Paragraph({ spacing: { before: 0, after: 0, line: 120, lineRule: 'auto' }, children: [] });
}

/* ── HTML náhled (jednoduchý, bez přesných šířek) ───────────────── */
let _lastBlob = null;   // poslední vygenerovaný DOCX blob
let _lastFname = '';    // a jeho název

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function previewHtml(d) {
  let h = '<div class="doc">';

  const hdr = [d.regionName, d.compName].filter(Boolean).map(esc).join('<br>');
  if (hdr) h += '<div class="doc-hdr">' + hdr + '</div>';

  h += '<h1>' + esc('Zpravodaj z kola č. ' + d.kolo) + '</h1>';

  // 1. Výsledky — každý zápas vlastní tabulka
  h += '<h2>1. Výsledky</h2>';
  d.matchList.forEach(function(m, mi) {
    const nr = d.kolo + '.' + (mi + 1);
    h += '<table class="res"><tbody>';
    h += '<tr class="mh">'
       + '<td class="c num">' + esc(nr) + '</td>'
       + '<td colspan="2">' + esc(m.homeTeamName || '') + '</td>'
       + '<td class="c num">' + esc(fmtScore(m.homeTeamScore, m.awayTeamScore)) + '</td>'
       + '<td class="r" colspan="2">' + esc(m.awayTeamName || '') + '</td>'
       + '</tr>';
    norm(m.matchGames).forEach(function(g, idx) {
      h += '<tr>'
         + '<td class="c num">' + (idx + 1) + '</td>'
         + '<td>' + esc(g.homePlayerName || '') + '</td>'
         + '<td class="r elo">' + esc(eloStr(g.homePlayerRating)) + '</td>'
         + '<td class="c num">' + esc(fmtResult(g.homePlayerResult, g.awayPlayerResult)) + '</td>'
         + '<td class="elo">' + esc(eloStr(g.awayPlayerRating)) + '</td>'
         + '<td>' + esc(g.awayPlayerName || '') + '</td>'
         + '</tr>';
    });
    h += '</tbody></table>';
  });

  // 2. Pořadí
  h += '<h2>2. Pořadí družstev</h2>';
  const hd = ['P', 'Družstvo', 'Z', '+', '=', '−', 'B', 'Sk', 'V'];
  h += '<table class="stand"><thead><tr>'
     + hd.map(function(x, i) { return '<th class="' + (i === 1 ? 'l' : 'c') + '">' + esc(x) + '</th>'; }).join('')
     + '</tr></thead><tbody>';
  d.teamList.forEach(function(t, idx) {
    const vals = [
      t.teamRank != null ? t.teamRank : (idx + 1), t.teamName || '',
      t.matchesPlayed != null ? t.matchesPlayed : 0, t.matchWins != null ? t.matchWins : 0,
      t.matchDraws != null ? t.matchDraws : 0, t.matchLosses != null ? t.matchLosses : 0,
      t.points != null ? t.points : 0, fmtHalf(t.score), t.wonGames != null ? t.wonGames : 0
    ];
    h += '<tr>' + vals.map(function(v, i) {
      return '<td class="' + (i === 1 ? 'l' : 'c') + '">' + esc(v) + '</td>';
    }).join('') + '</tr>';
  });
  h += '</tbody></table>';

  // 3. Různé
  h += '<h2>3. Různé a ostatní</h2>';
  if (d.poznamka) d.poznamka.split('\n').forEach(function(line) { h += '<p>' + esc(line) + '</p>'; });
  if (d.jmeno) h += '<p><b>' + esc(d.jmeno) + '</b></p>';
  h += '<p>' + esc(d.dateStr) + '</p>';

  h += '</div>';
  return h;
}

function downloadDocx() {
  if (!_lastBlob) return;
  const url = URL.createObjectURL(_lastBlob);
  const a = document.createElement('a');
  a.href = url; a.download = _lastFname; a.click();
  setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
}

function printPreview() { window.print(); }

/* ── Hlavní generátor ───────────────────────────────────────────── */
async function generate() {
  const compId   = document.getElementById('compId').value.trim();
  const kolo     = document.getElementById('kolo').value.trim();
  const poznamka = document.getElementById('poznamka').value.trim();

  if (!compId || !kolo) { setMsg('Vyplňte compId a číslo kola.', 'err'); return; }

  const btn = document.getElementById('btn-gen');
  btn.disabled = true;   // dvojklik by frontu zbytečně zdvojil
  try {
    const details   = await apiGet('/competitions/' + compId + '/details', 'detaily soutěže');
    // Pořadí se přepočítává současně s výsledky kola. Když se výsledky načetly
    // napřímo (cache miss/expirace, ne hit), vynuť přímé načtení i u tabulky,
    // ať pořadí neviselo na starší (byť ještě platné) cache verzi.
    const matchesPath = '/competitions/' + compId + '/round/' + kolo + '/matches';
    const matchesFromCache = getCached(matchesPath) !== null;
    const matches   = await apiGet(matchesPath, 'výsledky');
    const standings = await apiGet('/competitions/' + compId + '/table', 'pořadí', false, !matchesFromCache);

    let roundDate = '';
    try {
      const sched = await apiGet('/competitions/' + compId + '/round/' + kolo + '/schedule', 'termín kola');
      roundDate = fmtDateCz(sched.roundDate || '');
    } catch (_) {}

    const compName   = details.compName   || ('Soutěž ' + compId);
    const regionName = details.regionName || '';
    const jmeno      = vedouciName(details.compManagerName);
    const matchList  = norm(matches);
    const teamList   = norm(standings);

    console.log('details:', details);
    console.log('matches[0]:', matchList[0]);
    console.log('standings[0]:', teamList[0]);

    /* ── Obsah dokumentu ── */
    const children = [
      para('Zpravodaj z kola č. ' + kolo, { bold: true, align: 'center', size: 32, after: 160 }),
      para('1. Výsledky', { bold: true, size: FS, before: 60, after: 80 }),
    ];

    const nameW = computeNameWidth(matchList);
    matchList.forEach(function(match, mi) {
      children.push(buildMatchTable(match, kolo + '.' + (mi + 1), nameW));
      if (mi < matchList.length - 1) children.push(gap());
    });

    children.push(para('2. Pořadí družstev', { bold: true, size: FS, before: 200, after: 80 }));
    children.push(buildStandingsTable(teamList));
    children.push(para('3. Různé a ostatní', { bold: true, size: FS, before: 200, after: 80 }));

    if (poznamka) {
      poznamka.split('\n').forEach(function(line) { children.push(para(line)); });
    }
    if (jmeno) children.push(para(jmeno, { bold: true, before: 80 }));
    children.push(para(todayCz()));

    /* ── Stránkové záhlaví: kraj + název soutěže (vpravo) ── */
    const headerLines = [];
    if (regionName) headerLines.push(regionName);
    headerLines.push(compName);
    const pageHeader = new docx.Header({
      children: headerLines.map(function(line) {
        return new docx.Paragraph({
          alignment: 'right',
          spacing: { before: 0, after: 0, line: 200, lineRule: 'auto' },
          children: [new docx.TextRun({ text: line, size: 16, font: 'Arial' })]
        });
      })
    });

    /* ── Dokument ──
       header 0,7 cm od okraje; horní okraj zmenšen na 1,4 cm (méně místa nahoře) */
    const doc = new docx.Document({
      styles: { default: { document: { run: { font: 'Arial', size: 22 } } } },
      sections: [{
        headers: { default: pageHeader },
        properties: {
          page: {
            size:   { width: PAGE_W, height: PAGE_H },
            margin: {
              top: Math.round(1.4 * CM), right: MARGIN, bottom: MARGIN, left: MARGIN,
              header: Math.round(0.7 * CM), footer: Math.round(0.7 * CM)
            }
          }
        },
        children: children,
      }]
    });

    setMsg('Generuji soubor…');
    const blob = await docx.Packer.toBlob(doc);

    // Název souboru z šablony: [soutez] → compId, [kolo] → číslo kola
    const tpl   = (document.getElementById('fname').value.trim() || '[soutez]_[kolo]');
    const fname = resolveFname(tpl, compId, kolo);

    _lastBlob = blob;
    _lastFname = fname;

    // Ulož do historie (soutěž + šablona názvu souboru)
    saveHistoryEntry({ compId: compId, compName: compName, fname: tpl, ts: Date.now() });

    // Náhled pod formulářem + lišta s tlačítky (žádné automatické stažení)
    document.getElementById('output').innerHTML =
      '<div id="dl-bar">'
      + '<button id="btn-dl" onclick="downloadDocx()">⬇ Stáhnout soubor ' + esc(fname) + '</button>'
      + '<button id="btn-pdf" onclick="printPreview()">Uložit jako PDF (tisk)</button>'
      + '</div>'
      + previewHtml({
          kolo: kolo, compName: compName, regionName: regionName,
          matchList: matchList, teamList: teamList,
          poznamka: poznamka, jmeno: jmeno, dateStr: todayCz()
        });

    document.getElementById('msg').innerHTML =
      '<span class="ok">✓ Hotovo — náhled níže. Soubor stáhneš tlačítkem nad dokumentem.</span>'
      + '<div class="note">'
      + '• Vzhled se mezi <b>zobrazeným náhledem</b>, <b>DOCX</b> a <b>tiskem</b> liší. '
      + 'Nejlepšího výsledku dosáhnete stažením DOCX a exportem do PDF přímo z Office.<br>'
      + '• Tabulka pořadí odpovídá <b>datu generování</b> zpravodaje — pořadí k předchozím kolům nelze vygenerovat.'
      + '</div>';

  } catch (e) {
    setMsg('Chyba: ' + e.message, 'err');
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}

/* ── Náhled názvu soutěže pod polem ID ──────────────────────────
   Debounce + nevolá se zbytečně: jen při změně ID, cache hit = bez sítě,
   tichý dotaz (neruší hlavní hlášku). */
let _lookupTimer = null;
let _lookupId    = null;   // ID, pro které už název máme / zjišťujeme
let _fnameAuto   = true;   // název souboru je auto-návrh (uživatel ho neměnil)

function scheduleLookup() {
  clearTimeout(_lookupTimer);
  _lookupTimer = setTimeout(lookupCompName, 500);
}

function nameLine(d, compId) {
  const name = d.compName || ('Soutěž ' + compId);
  let html = '<b>' + esc(name) + '</b>';
  if (d.regionName) html += '<span class="region">' + esc(d.regionName) + '</span>';
  return html;
}

/* Sezóna podle dnešního data – nová začíná v září (měsíc 9).
   Vrací poslední dvojčíslí obou let, např. "25_26". */
function seasonYears() {
  const d = new Date();
  let start = d.getFullYear();
  if (d.getMonth() < 8) start -= 1;   // led–srp ⇒ sezóna začala loni
  const yy = function(n) { return ('0' + (n % 100)).slice(-2); };
  return yy(start) + '_' + yy(start + 1);
}

/* Zkratka z názvu soutěže: první písmeno/číslice každého slova,
   oddělovače (pomlčky apod.) se přeskočí. Diakritika odstraněna. */
function abbrev(compName) {
  if (!compName) return 'soutez';
  const s = compName.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const letters = s.split(/[\s/]+/)
    .map(function(w) { const m = w.match(/[a-zA-Z0-9]/); return m ? m[0] : ''; })
    .filter(Boolean).join('');
  return (letters || 'soutez').toLowerCase();
}

/* Navržená šablona názvu, např. "ksa_25_26_[kolo]". */
function suggestFname(compName) {
  return abbrev(compName) + '_' + seasonYears() + '_[kolo]';
}

/* Dosadí placeholdery a doplní příponu → výsledný název souboru.
   Kolo v názvu vždy dvouciferné (1 → 01). */
function resolveFname(tpl, compId, kolo) {
  const k = /^\d+$/.test(kolo) ? kolo.padStart(2, '0') : kolo;
  let f = (tpl || '[soutez]_[kolo]')
            .replace(/\[soutez\]/gi, compId)
            .replace(/\[kolo\]/gi, k)
            .replace(/[\\/:*?"<>|]+/g, '_');   // nepovolené znaky
  if (!/\.docx$/i.test(f)) f += '.docx';
  return f;
}

/* Živý náhled výsledného názvu v popisku pole. */
function updateFnamePreview() {
  const tpl    = document.getElementById('fname').value;
  const compId = document.getElementById('compId').value.trim();
  const kolo   = document.getElementById('kolo').value.trim();
  document.getElementById('fnamePreview').textContent = resolveFname(tpl, compId, kolo);
}

/* Doplní navržený název, jen pokud ho uživatel ručně neměnil. */
function maybeSuggestFname(d) {
  if (!_fnameAuto) return;
  document.getElementById('fname').value = suggestFname(d.compName || '');
  updateFnamePreview();
}

/* Starý generický default (před auto-návrhem) – bereme jako „auto",
   ať ho nový návrh může přepsat. */
function isLegacyTpl(t) {
  return !t || t.trim() === '' || t.trim() === '[soutez]_[kolo]';
}

async function lookupCompName() {
  const view   = document.getElementById('compNameView');
  const compId = document.getElementById('compId').value.trim();
  if (!compId)            { view.textContent = ''; _lookupId = null; return; }
  if (compId === _lookupId) return;        // totéž ID už řešíme/máme → nevolat
  _lookupId = compId;

  const path = '/competitions/' + compId + '/details';
  const cached = getCached(path);
  if (cached) { view.innerHTML = nameLine(cached, compId); maybeSuggestFname(cached); return; }

  view.textContent = 'načítám název…';
  try {
    const d = await apiGet(path, null, true);   // tichý dotaz
    if (document.getElementById('compId').value.trim() !== compId) return; // ID se mezitím změnilo
    view.innerHTML = nameLine(d, compId);
    maybeSuggestFname(d);
  } catch (e) {
    if (document.getElementById('compId').value.trim() === compId)
      view.innerHTML = '<span class="err">' + (Date.now() < _blockUntil ? esc(e.message) : 'soutěž nenalezena') + '</span>';
    _lookupId = null;   // ať to po opravě zkusí znovu
  }
}

/* ── Historie posledních 5 generování (localStorage) ────────────
   Záznam = soutěž (ID + název) + šablona názvu souboru.
   Přežívá „Vymazat cache" (jiný klíč než sscr_*). */
const HKEY = 'sscrHistory';
const HMAX = 5;

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HKEY)) || []; }
  catch (e) { return []; }
}
function saveHistoryEntry(rec) {
  let h = loadHistory();
  h = h.filter(function(x) { return !(x.compId === rec.compId && x.fname === rec.fname); });
  h.unshift(rec);
  h = h.slice(0, HMAX);
  try { localStorage.setItem(HKEY, JSON.stringify(h)); } catch (e) {}
  renderHistory();
}
function renderHistory() {
  const box = document.getElementById('history');
  const h   = loadHistory();
  if (!h.length) { box.innerHTML = ''; return; }
  let html = '<div id="hist-list">';
  h.forEach(function(rec, i) {
    const name = rec.compName || ('Soutěž ' + rec.compId);
    let tpl = rec.fname || '';
    if (!/\.docx$/i.test(tpl)) tpl += '.docx';
    html += '<button type="button" class="hist-item" onclick="applyHistory(' + i + ')">'
          + '<span class="hist-name">' + esc(name) + '</span>'
          + '<span class="hist-tpl">' + esc(tpl) + '</span>'
          + '</button>';
  });
  html += '</div>';
  box.innerHTML = html;
}
function applyHistory(i) {
  const rec = loadHistory()[i];
  if (!rec) return;
  document.getElementById('compId').value = rec.compId;
  document.getElementById('fname').value  = rec.fname;
  _fnameAuto = isLegacyTpl(rec.fname);   // reálná šablona = respektovat; starý default = přepsat návrhem
  _lookupId = null;                      // vynutit re-lookup i pro stejné compId
  updateFnamePreview();
  lookupCompName();
}

/* ── Inicializace ───────────────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', function() {
  document.getElementById('compId').addEventListener('input', function() { scheduleLookup(); updateFnamePreview(); });
  document.getElementById('kolo').addEventListener('input', updateFnamePreview);
  // Jakmile uživatel název ručně upraví, přestaneme ho přepisovat návrhem
  document.getElementById('fname').addEventListener('input', function() { _fnameAuto = false; updateFnamePreview(); });

  // Poslední záznam předvyplní soutěž + šablonu názvu
  // Vyčisti staré „legacy" záznamy ([soutez]_[kolo]) z dřívějšího testování
  let h = loadHistory();
  const cleaned = h.filter(function(x) { return !isLegacyTpl(x.fname); });
  if (cleaned.length !== h.length) {
    try { localStorage.setItem(HKEY, JSON.stringify(cleaned)); } catch (e) {}
    h = cleaned;
  }

  if (h.length) {
    document.getElementById('compId').value = h[0].compId;
    document.getElementById('fname').value  = h[0].fname;
    _fnameAuto = isLegacyTpl(h[0].fname);   // (reálná šablona ⇒ respektovat)
  }
  renderHistory();
  updateFnamePreview();
  lookupCompName();
});
</script>
